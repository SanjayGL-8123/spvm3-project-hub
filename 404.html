<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | SPVM3 Project Hub</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e293b 100%);
      color: white;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(14, 165, 233, 0.35);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(14, 165, 233, 0.2);
    }
    .brand-logo {
      width: 90px;
      height: 90px;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.5);
      margin-bottom: 20px;
      object-fit: cover;
    }
    h1 {
      font-size: 54px;
      margin: 0;
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 1px;
    }
    h2 {
      font-size: 22px;
      margin: 10px 0 15px;
      color: #ffffff;
      font-weight: 600;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }
    .btn:hover {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="SPVM3 Tech Solution" class="brand-logo">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist or may have been moved.</p>
    <a href="/" class="btn">Back to Project Hub</a>
  </div>
</body>
</html>
